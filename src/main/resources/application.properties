spring.application.name=asset-management

# Use H2 in MySQL compatibility mode for development/testing
spring.datasource.url=jdbc:h2:mem:mams_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# JWT configuration
jwt.secret=94a08da1fecbb6e8b46990538c7b50b29848f572718cd981d346ffbd28468b6b
jwt.expirationMs=86400000

# Server port
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.military.assetmanagement=DEBUG
